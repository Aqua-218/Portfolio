# cargo-deny の設定。CIと毎週の定期実行で `cargo deny check` を回す

[graph]
all-features = true

[advisories]
# 脆弱性はいつも落とす。メンテされていないものは、自分が直接使うものだけ落とす
# (paste[RUSTSEC-2024-0436]は画像変換のravif→rav1eの中で使われていて、こちらでは変えられない)
unmaintained = "workspace"
yanked = "deny"

[licenses]
# 自分のクレート(publishしない)は見ない
private = { ignore = true }
# 使ってよいライセンス。コピーレフト(GPLなど)は入れない
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "NCSA",
]
confidence-threshold = 0.9

[bans]
# 同じクレートの版がいくつも入るのは、気づけるように警告だけ
multiple-versions = "warn"
wildcards = "deny"
# 自分のクレートどうしはpathでつなぐので、版の指定がなくてもいい
allow-wildcard-paths = true

[sources]
# crates.io 以外からは取らない
unknown-registry = "deny"
unknown-git = "deny"
