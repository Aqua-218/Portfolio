[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 日本語の中の英単語(WebPなど)を、ひとつながりの語とみなして誤検知する
doc_markdown = "allow"

# 依存のクレート(画像のエンコーダーなど)は、開発中とテストでも最適化してビルドする。
# 最適化しないとAVIFの書き出しがとても遅い
[profile.dev.package."*"]
opt-level = 3

# ブラウザで読むWasm(ドット猫・検証)のビルド。読み込みを速くするため、速さより大きさを優先する
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
