[package]
name = "content-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgenが作るコードはunsafeを使うので、このクレートだけunsafe_codeを禁止しない。
# そのためworkspaceのlintsを継がず、clippyの設定だけ同じにする(pxcat-wasmと同じ)
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"

[dependencies]
content = { path = "../content" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
