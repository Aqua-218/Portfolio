name: CodeQL

# コードの脆弱性を静的に調べる。結果はリポジトリのSecurityのタブに出る
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 9:30(日本時間)
    - cron: "30 0 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read # コードを読む
      security-events: write # 結果をSecurityのタブに送る
    strategy:
      fail-fast: false
      matrix:
        # TypeScriptとJavaScript、GitHub Actionsのワークフロー。Rustはcargo-deny(依存)とclippy(コード)で見ている
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # 詳しめの検査
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
