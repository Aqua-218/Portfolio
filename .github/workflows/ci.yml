name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定はリポジトリを読むだけ。書き込みのいるジョブはない
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ブログの記事の日付をgitの履歴から読む
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm rust github:wasm-bindgen/wasm-bindgen
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # ビルドのあと、書き出したページをChromiumで開いて、使う字だけのフォントを作る(scripts/fonts.mjs)
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm build
      # 管理画面のトークンが、コミットしたファイルや書き出したサイトに入っていないか見る
      - run: sh scripts/check-tokens.sh apps/web/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/out/
          # .htaccess(守りのヘッダー・キャッシュ・転送)も渡す。ないと、あとのジョブがヘッダーなしで動く
          include-hidden-files: true
          retention-days: 3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo build -p pxcat-wasm --target wasm32-unknown-unknown --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm rust github:wasm-bindgen/wasm-bindgen
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # 型チェックがwasm-bindgenの作る型を読むので、先にビルドする(ドット猫と、検証のWasm)
      - run: pnpm --filter @portfolio/pxcat --filter @portfolio/content-wasm build
      - run: pnpm check
      # Rustの型からTSの型を作り直して、コミットされているものと同じか見る
      - run: pnpm --filter @portfolio/content-types gen
      - run: git diff --exit-code packages/content-types
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ブログの記事の日付をgitの履歴から読む
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm rust github:wasm-bindgen/wasm-bindgen
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portfolio/pxcat --filter @portfolio/content-wasm build
      - run: pnpm test
      - run: cargo test --workspace --locked
      # e2eはビルドしたout/を相手にする。ビルドでもChromiumを使う
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @portfolio/web e2e

  vrt:
    needs: build
    runs-on: ubuntu-latest
    # 手元のpnpm vrtと同じイメージで撮り、フォントの描画をそろえる
    container:
      # 版(v1.64.1-noble)だけでなく中身のハッシュで固定する。手元のpnpm vrt(vrt/run.sh)と同じもの
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-vrt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-vrt-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/out/
      - run: pnpm --filter @portfolio/web exec playwright test -c playwright.vrt.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-diff
          path: apps/web/test-results/
          retention-days: 7

  apache:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/out/
      # 本番(ロリポップ)と同じく.htaccessを読むApacheで出して、転送・404・ヘッダー・種類を確かめる
      - run: pnpm --filter @portfolio/web apache

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/out/
      # e2eと同じChromiumで測る
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @portfolio/web lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouse/
          # 名前が.で始まるフォルダなので、これがないと何も残らない
          include-hidden-files: true
          retention-days: 7

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: github:leanprover/elan
      # lean・lakeのプロキシ。miseをキャッシュから戻したときはpostinstallが走らないので、なければ作る
      - run: |
          test -x "$HOME/.elan/bin/lake" ||
            "$(mise where github:leanprover/elan)/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            proofs/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
          restore-keys: lean-${{ runner.os }}-
      # Mathlibは手元でビルドせず、ビルドしたものを取ってくる
      - run: lake exe cache get
      # 警告も落とす。sorryが残っていると警告になる
      - run: lake build --wfail

  aeneas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CharonとAeneasは、ビルドに時間がかかるので版ごとに取っておく
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pxcat-aeneas
          key: aeneas-${{ runner.os }}-${{ hashFiles('proofs/aeneas.env') }}
      # pxcat-coreからLeanを作り直して、コミットされているものと同じか見る
      - run: sh proofs/extract.sh
      - run: git diff --exit-code proofs/PxCat

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: java
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pxcat-tla
          key: tla-${{ runner.os }}-${{ hashFiles('specs/tlc.sh') }}
      # PlusCalを変換し直して検査する。壊した設定で落ちることも見る
      - run: sh specs/tlc.sh
      # 変換したTLAがコミットされているものと同じか見る
      - run: git diff --exit-code specs

  # ワークフローの穴(権限の広さ、資格情報の残し方、固定していないアクションなど)を調べる
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: github:zizmorcore/zizmor
      # トークンを渡すと、知られた脆弱性のあるアクションや、なりすましのコミットも調べる
      - run: zizmor --persona=pedantic --min-severity=low .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
